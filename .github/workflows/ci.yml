name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch instead of queuing them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      # Report every failure, not just the first one.
      fail-fast: false
      matrix:
        # db:schema:check fails if supabase/schema.sql no longer matches the
        # migrations it is generated from. That file is what contributors paste
        # into a fresh project, so it drifting from production is a real bug.
        task: [lint, typecheck, test, build, db:schema:check]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run ${{ matrix.task }}
        env:
          # The build reads these at compile time. They are placeholders — CI
          # only checks that the app compiles, it never talks to Supabase.
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key

  # Applies every migration in order to an empty Postgres, proving they run from
  # scratch. Nothing else does this: production was built by hand and the
  # baseline migration was marked applied rather than executed, so without this
  # job a broken migration would only surface when someone sets up the project.
  #
  # This talks to a throwaway container, never to Supabase. No secrets.
  migrations:
    name: migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        # Match production's major version. Supabase reports 17.6 for this
        # project; check with `cat supabase/.temp/postgres-version` after a link.
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres

    steps:
      - uses: actions/checkout@v7

      - name: Create Supabase stubs
        run: psql -v ON_ERROR_STOP=1 -f supabase/ci/postgres-stubs.sql

      - name: Apply migrations in order
        run: |
          for f in supabase/migrations/*.sql; do
            echo "::group::$f"
            psql -v ON_ERROR_STOP=1 -f "$f"
            echo "::endgroup::"
          done

      - name: Assert RLS policies and column grants
        run: psql -v ON_ERROR_STOP=1 -f supabase/ci/assert_access_control.sql
