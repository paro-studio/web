name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The merge queue tests each PR against the latest main before merging it, so
  # contributors never need an "update branch" round trip.
  merge_group:

# Cancel superseded runs on the same branch instead of queuing them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      # Report every failure, not just the first one.
      fail-fast: false
      matrix:
        # db:schema:check fails if supabase/schema.sql no longer matches the
        # migrations it is generated from. That file is what contributors paste
        # into a fresh project, so it drifting from production is a real bug.
        task: [lint, typecheck, test, build, db:schema:check]

    steps:
      # Actions are pinned to commit SHAs so a moved tag cannot change what runs.
      # Dependabot keeps the SHAs and the version comments up to date.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Same file `nvm use` reads, so CI and local development match.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run ${{ matrix.task }}
        env:
          # The build reads these at compile time. They are placeholders — CI
          # only checks that the app compiles, it never talks to Supabase.
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key

  # Applies every migration in order to an empty Postgres, proving they run from
  # scratch. Nothing else does this: production was built by hand and the
  # baseline migration was marked applied rather than executed, so without this
  # job a broken migration would only surface when someone sets up the project.
  #
  # This talks to a throwaway container, never to Supabase. No secrets.
  migrations:
    name: migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        # Match production's major version. Supabase reports 17.6 for this
        # project; check with `cat supabase/.temp/postgres-version` after a link.
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create Supabase stubs
        run: psql -v ON_ERROR_STOP=1 -f supabase/ci/postgres-stubs.sql

      - name: Apply migrations in order
        run: |
          for f in supabase/migrations/*.sql; do
            echo "::group::$f"
            psql -v ON_ERROR_STOP=1 -f "$f"
            echo "::endgroup::"
          done

      - name: Assert RLS policies and column grants
        run: psql -v ON_ERROR_STOP=1 -f supabase/ci/assert_access_control.sql

      - name: Assert view and copy counter throttling
        run: psql -v ON_ERROR_STOP=1 -f supabase/ci/assert_counters.sql

      - name: Assert write rules for created_at, profiles and storage
        run: psql -v ON_ERROR_STOP=1 -f supabase/ci/assert_write_rules.sql

  # A workflow with a syntax or expression error does not fail, it just never
  # runs. This catches that, plus shell mistakes inside run steps.
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Dependabot does not update this tag. Bump it by hand now and then.
      - name: Lint workflow files
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color
